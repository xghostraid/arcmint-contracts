# Deploy from repo root: fly deploy --config promptfun/fly.toml
# Or: cd promptfun && fly launch / fly deploy
app = "promptfun-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  PROMPTFUN_DB = "/data/promptfun.sqlite"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "promptfun_data"
  destination = "/data"

[checks]
  [checks.http]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/stats"
    timeout = "5s"
